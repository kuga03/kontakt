<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>autotest</title>
<style>html,body{margin:0;padding:0;background:#0a0a2a;overflow:hidden;height:100%;width:100%}canvas{display:block;margin:0}#report{position:fixed;left:0;top:0;z-index:9999;color:#0f0;background:#000;font:12px monospace;white-space:pre-wrap;max-width:100vw;}</style>
</head>
<body>
<pre id="report">BOOTING...</pre>
<script>
window.__errors = [];
window.addEventListener('error', function(e){ window.__errors.push('WINERR: ' + (e.message || e.error)); });
(function(){
  var q = new URLSearchParams(location.search);
  var scene = q.get('scene') || 'game';
  var rep = function(t){ document.getElementById('report').textContent += '\n' + t; };
  if (q.get('map')) {
    try {
      var raw = localStorage.getItem('sideShooterState');
      var st = raw ? JSON.parse(raw) : {};
      st.freeMapId = q.get('map');
      localStorage.setItem('sideShooterState', JSON.stringify(st));
      localStorage.removeItem('sideShooterModeMaps');
    } catch(e){}
  }
  var s = document.createElement('script');
  s.src = './vendor/phaser.min.js';
  s.onload = function(){
    import('./js/game.js').then(function(){
      var tries = 0;
      var iv = setInterval(function(){
        tries++;
        try {
          var g = window.__game;
          if (g && g.scene.isActive('MenuScene')) {
            clearInterval(iv);
            if (scene === 'editor') {
              g.scene.getScene('MenuScene').scene.start('LevelEditorScene');
            } else {
              g.scene.getScene('MenuScene').scene.start('GameScene', {
                mode: q.get('mode') || 'CAMPAIGN', levelIndex: parseInt(q.get('level') || '0', 10) || 0,
                selectedClass: 'Assault', playerName: 'Test', scoreLimit: 200
              });
            }
            setTimeout(makeReport, 6000);
            return;
          }
          if (g && (g.scene.isActive('GameScene') || g.scene.isActive('LevelEditorScene'))) {
            clearInterval(iv); setTimeout(makeReport, 6000); return;
          }
        } catch(e){ rep('AUTOERR ' + e.message); }
        if (tries > 300) { clearInterval(iv); rep('TIMEOUT'); makeReport(); }
      }, 200);
    }).catch(function(err){ rep('boot fail ' + (err && err.message)); });
  };
  document.head.appendChild(s);
  function makeReport(){
    try {
      var g = window.__game;
      var names = [];
      g.scene.scenes.forEach(function(s){ if (g.scene.isActive(s.scene.key)) names.push(s.scene.key); });
      var out = ['=== REPORT active=' + names.join(',') + ' ==='];
      out.push('bldKeys: ' + (function(){ try {
        return Object.keys(g.textures.list || {}).filter(function(k){ return k.indexOf('bld_') === 0; }).length;
      } catch(e){ return 'ERR'; } })());
      out.push('winErrors: ' + (window.__errors.length ? window.__errors.join(' | ') : 'none'));
      document.getElementById('report').textContent = out.join('\n');
    } catch(e){ rep('report fail: ' + e.message); }
  }
})();
</script>
</body>
</html>
