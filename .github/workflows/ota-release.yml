name: OTA Release (bundle + manifest)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (defaults to version.json)'
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "version.json"

permissions:
  contents: write

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V=$(node -p "require('./version.json').version")
          fi
          SLUG=$(echo "$V" | tr ' /' '__' | tr -cd 'A-Za-z0-9._-')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Version: $V ($SLUG)"

      - name: Build web (www)
        run: npm run www

      - name: Pack OTA zip
        id: pack
        shell: bash
        run: |
          node scripts/make-ota-zip.cjs ota-bundle.zip > pack.json
          cat pack.json
          echo "sha256=$(node -p "require('./pack.json').sha256")" >> "$GITHUB_OUTPUT"

      - name: Make manifest
        shell: bash
        run: |
          V='${{ steps.ver.outputs.version }}'
          SLUG='${{ steps.ver.outputs.slug }}'
          SHA='${{ steps.pack.outputs.sha256 }}'
          BUNDLE_URL="https://github.com/${{ github.repository }}/releases/download/v${SLUG}/ota-bundle.zip"
          cat > ota-manifest.json <<JSON
          {"version":"${V}","url":"${BUNDLE_URL}","checksum":"${SHA}"}
          JSON
          cat ota-manifest.json

      - name: Publish GitHub Release (public assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.slug }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ota-bundle.zip
            ota-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          echo "### OTA published (public repo, no R2/Cloudflare secrets needed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: ${{ steps.pack.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- manifest: https://github.com/${{ github.repository }}/releases/latest/download/ota-manifest.json" >> "$GITHUB_STEP_SUMMARY"
