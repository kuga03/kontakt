<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Контакт</title>
  <link rel="icon" href="data:,">
  <style>
    /* Rubik80sFade удалён: файла assets/fonts/Rubik80sFade-Regular.ttf нет на диске.
       Используется ScienceGothic с fallback monospace, sans-serif. */
    @font-face {
      font-family: 'ScienceGothic';
      src: url('assets/fonts/ScienceGothic-VariableFont_CTRS,slnt,wdth,wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a2a;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    canvas {
      display: block;
      margin: 0;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="err-overlay" style="display:none;position:fixed;left:8px;bottom:8px;max-width:92vw;max-height:60vh;overflow:auto;z-index:9999;background:#330000;color:#ffaaaa;font:12px/1.5 monospace,sans-serif;padding:8px 12px;border:1px solid #ff5555;white-space:pre-wrap;user-select:text;"></div>
  <script>
    (function () {
      // Capacitor-Updater (Android OTA): сообщаем нативному слою, что бандл
      // загрузился. Без этого вызова плагин считает обновление упавшим и
      // откатывается на прошлый. В обычном браузере плагина нет — молча пропускаем.
      try {
        var __cu = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater;
        if (__cu && __cu.notifyAppReady) __cu.notifyAppReady().catch(function () {});
      } catch (e) {}
      function showErr(msg) {
        var el = document.getElementById('err-overlay');
        if (!el) return;
        try { console.error(msg); } catch (e) {}
        el.style.display = 'block';
        el.textContent += (el.textContent ? '\n---\n' : '') + msg;
      }
      // Коротко + подробно: сообщение, файл:строка:колонка, первые строки стека.
      function fmtErr(prefix, err, loc) {
        var parts = [prefix];
        if (loc) parts.push('где: ' + loc);
        if (err) {
          if (err.message) parts.push('что: ' + err.message);
          else parts.push('что: ' + String(err));
          // Chrome для SyntaxError в import() кладёт файл:строку прямо в message,
          // а в stack — полный трейс. Показываем первые 8 строк, остальное в F12.
          if (err.stack && String(err.stack).indexOf(String(err.message)) !== 0) {
            parts.push('стек:\n' + String(err.stack).split('\n').slice(0, 8).join('\n'));
          } else if (err.stack) {
            var lines = String(err.stack).split('\n').slice(0, 8).join('\n');
            if (lines !== String(err.message)) parts.push('стек:\n' + lines);
          }
        }
        // Подсказка про file:// — модули через двойной клик блокируются CORS.
        try {
          if (location.protocol === 'file:') {
            parts.push('подсказка: открыт через file:// — import() так блокируется. Запусти start-server.cmd и открой http://localhost:8080');
          }
        } catch (e) {}
        parts.push('(полный текст — в консоли F12)');
        return parts.join('\n');
      }
      window.__showErr = showErr;
      window.__fmtErr = fmtErr;
      // Ловим всё: ошибки скриптов (файл:строка:колонка) и падения промисов.
      window.addEventListener('error', function (e) {
        var loc = (e.filename || '') + (e.lineno ? ':' + e.lineno : '') + (e.colno ? ':' + e.colno : '');
        showErr(fmtErr('Ошибка: ' + (e.message || 'неизвестная ошибка загрузки'), e.error || null, loc || null));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = (e && e.reason) || null;
        showErr(fmtErr('Необработанный rejection', reason, null));
      });
      window.__phaserCdnFailed = function () {
        showErr('Не удалось загрузить Phaser ни локально, ни с CDN. Проверьте интернет.');
      };
    })();
  </script>
  <script src="./vendor/phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"><\/script>');
    }
  </script>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
