<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Контакт</title>
  <link rel="icon" href="data:,">
  <style>
    /* Rubik80sFade удалён: файла assets/fonts/Rubik80sFade-Regular.ttf нет на диске.
       Используется ScienceGothic с fallback monospace, sans-serif. */
    @font-face {
      font-family: 'ScienceGothic';
      src: url('assets/fonts/ScienceGothic-VariableFont_CTRS,slnt,wdth,wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a2a;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    canvas {
      display: block;
      margin: 0;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="offline-overlay" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;z-index:99999;background:rgba(0,0,0,0.92);color:#ffffff;font-family:sans-serif;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box;">
    <div style="max-width:500px;width:100%;">
      <div id="offline-status" style="font-size:18px;margin-bottom:30px;line-height:1.5;">Подключение к серверу...</div>
      <div id="offline-timer" style="font-size:48px;color:#ffd700;margin-bottom:30px;font-weight:bold;">60</div>
      <div id="offline-buttons" style="display:none;gap:15px;justify-content:center;flex-wrap:wrap;">
        <button id="btn-play-offline" style="font-size:16px;padding:14px 28px;background:#2a5a2a;color:#fff;border:none;border-radius:6px;cursor:pointer;min-width:160px;">Играть<br><small style="font-size:12px;opacity:0.8;">офлайн (без сетевых режимов)</small></button>
        <button id="btn-wait-online" style="font-size:16px;padding:14px 28px;background:#2a4a6a;color:#fff;border:none;border-radius:6px;cursor:pointer;min-width:160px;">Ожидать<br><small style="font-size:12px;opacity:0.8;">подключения</small></button>
      </div>
    </div>
  </div>
  <div id="err-overlay" style="display:none;position:fixed;left:8px;bottom:8px;max-width:92vw;max-height:60vh;overflow:auto;z-index:9999;background:#330000;color:#ffaaaa;font:12px/1.5 monospace,sans-serif;padding:8px 12px;border:1px solid #ff5555;white-space:pre-wrap;user-select:text;"></div>
  <script>
    (function () {
      // Capacitor-Updater (Android OTA): сообщаем нативному слою, что бандл
      // загрузился. Без этого вызова плагин считает обновление упавшим и
      // откатывается на прошлый. В обычном браузере плагина нет — молча пропускаем.
      try {
        var __cu = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater;
        if (__cu && __cu.notifyAppReady) __cu.notifyAppReady().catch(function () {});
      } catch (e) {}
      function showErr(msg) {
        var el = document.getElementById('err-overlay');
        if (!el) return;
        try { console.error(msg); } catch (e) {}
        el.style.display = 'block';
        el.textContent += (el.textContent ? '\n---\n' : '') + msg;
      }
      // Коротко + подробно: сообщение, файл:строка:колонка, первые строки стека.
      function fmtErr(prefix, err, loc) {
        var parts = [prefix];
        if (loc) parts.push('где: ' + loc);
        if (err) {
          if (err.message) parts.push('что: ' + err.message);
          else parts.push('что: ' + String(err));
          // Chrome для SyntaxError в import() кладёт файл:строку прямо в message,
          // а в stack — полный трейс. Показываем первые 8 строк, остальное в F12.
          if (err.stack && String(err.stack).indexOf(String(err.message)) !== 0) {
            parts.push('стек:\n' + String(err.stack).split('\n').slice(0, 8).join('\n'));
          } else if (err.stack) {
            var lines = String(err.stack).split('\n').slice(0, 8).join('\n');
            if (lines !== String(err.message)) parts.push('стек:\n' + lines);
          }
        }
        // Подсказка про file:// — модули через двойной клик блокируются CORS.
        try {
          if (location.protocol === 'file:') {
            parts.push('подсказка: открыт через file:// — import() так блокируется. Запусти start-server.cmd и открой http://localhost:8080');
          }
        } catch (e) {}
        parts.push('(полный текст — в консоли F12)');
        return parts.join('\n');
      }
      window.__showErr = showErr;
      window.__fmtErr = fmtErr;
      // Ловим всё: ошибки скриптов (файл:строка:колонка) и падения промисов.
      window.addEventListener('error', function (e) {
        var loc = (e.filename || '') + (e.lineno ? ':' + e.lineno : '') + (e.colno ? ':' + e.colno : '');
        showErr(fmtErr('Ошибка: ' + (e.message || 'неизвестная ошибка загрузки'), e.error || null, loc || null));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = (e && e.reason) || null;
        showErr(fmtErr('Необработанный rejection', reason, null));
      });
      window.__phaserCdnFailed = function () {
        showErr('Не удалось загрузить Phaser ни локально, ни с CDN. Проверьте интернет.');
      };
      var sources = [
        './vendor/phaser.min.js',
        'https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js',
        'https://unpkg.com/phaser@3.60.0/dist/phaser.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js'
      ];
      window.__bootGame = function () {
        import('./js/game.js?v=417').then(function () {
          // игра стартовала — ошибок импорта нет
        }).catch(function (err) {
          showErr(fmtErr('Не стартовала игра', err, './js/game.js (и его import-цепочка)'));
        });
      };
      (function loadNext(i) {
        if (i >= sources.length) {
          window.__phaserCdnFailed && window.__phaserCdnFailed();
          return;
        }
        var s = document.createElement('script');
        s.src = sources[i];
        s.crossOrigin = 'anonymous';
        s.onload = function () {
          if (typeof Phaser === 'undefined') loadNext(i + 1);
          else window.__bootGame();
        };
        s.onerror = function () { loadNext(i + 1); };
        document.head.appendChild(s);
      })(0);
      (function initOfflineCheck() {
        if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
        var overlay = document.getElementById('offline-overlay');
        var statusEl = document.getElementById('offline-status');
        var timerEl = document.getElementById('offline-timer');
        var buttonsEl = document.getElementById('offline-buttons');
        if (!overlay || !statusEl || !timerEl || !buttonsEl) return;
        var OTA_URL = 'https://kontakt-eijf.onrender.com/ota/updates';
        var countdown = 60;
        var timerInterval = null;
        var serverAvailable = false;
        var gameStarted = false;
        function showOverlay() { overlay.style.display = 'flex'; }
        function hideOverlay() { overlay.style.display = 'none'; }
        function showButtons() {
          statusEl.textContent = 'Сервер недоступен. Сетевые режимы не будут работать.';
          timerEl.style.display = 'none';
          buttonsEl.style.display = 'flex';
        }
        function startCountdown() {
          showOverlay();
          timerInterval = setInterval(function () {
            countdown--;
            timerEl.textContent = String(countdown);
            if (countdown <= 0) {
              clearInterval(timerInterval);
              timerInterval = null;
              showButtons();
            }
          }, 1000);
        }
        function startGame() {
          if (gameStarted) return;
          gameStarted = true;
          hideOverlay();
          loadPhaser();
        }
        function loadPhaser() {
          (function loadNext(i) {
            if (i >= sources.length) {
              window.__phaserCdnFailed && window.__phaserCdnFailed();
              return;
            }
            var s = document.createElement('script');
            s.src = sources[i];
            s.crossOrigin = 'anonymous';
            s.onload = function () {
              if (typeof Phaser === 'undefined') loadNext(i + 1);
              else window.__bootGame();
            };
            s.onerror = function () { loadNext(i + 1); };
            document.head.appendChild(s);
          })(0);
        }
        document.getElementById('btn-play-offline').addEventListener('click', startGame);
        document.getElementById('btn-wait-online').addEventListener('click', function () {
          countdown = 60;
          timerEl.style.display = 'block';
          buttonsEl.style.display = 'none';
          statusEl.textContent = 'Подключение к серверу...';
          startCountdown();
        });
        function checkServer() {
          fetch(OTA_URL, { method: 'GET', cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined })
            .then(function (r) { if (r && r.ok) { serverAvailable = true; } })
            .catch(function () {})
            .finally(function () {
              if (serverAvailable) { startGame(); }
              else { startCountdown(); }
            });
        }
        checkServer();
      })();
    })();
  </script>
</body>
</html>
